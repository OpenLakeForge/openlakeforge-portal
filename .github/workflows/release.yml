name: Release

# Pushing a tag vX.Y.Z publishes ghcr.io/openlakeforge/openlakeforge-portal:X.Y.Z
# (linux/amd64 and linux/arm64) and a GitHub release whose notes carry the
# digest OpenLakeForge pins in release/component-catalog.yaml.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/openlakeforge/openlakeforge-portal

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: The tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$version" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $(jq -r .version package.json)"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Release notes
        run: |
          cat > notes.md <<EOF
          Image: \`${IMAGE}:${VERSION}@${{ steps.build.outputs.digest }}\`

          Pin it in OpenLakeForge's \`release/component-catalog.yaml\`:

          \`\`\`yaml
          portal: ${IMAGE}:${VERSION}@${{ steps.build.outputs.digest }}
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0
        with:
          body_path: notes.md
          generate_release_notes: true
