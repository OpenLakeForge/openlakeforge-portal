name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: The served page links exactly the configured routes
        env:
          OLF_ROUTES_FILE: ${{ github.workspace }}/src/data/routes.example.json
          PORT: 8080
        run: |
          npm start &
          for _ in $(seq 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/ > page.html
          grep -o 'href="[^"]*"' page.html | sed 's/href="//; s/"$//' | sort -u > linked.txt
          jq -r '.[].url' "$OLF_ROUTES_FILE" | sort -u > wanted.txt
          diff wanted.txt linked.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          push: false
          load: true
          tags: openlakeforge-portal:ci
      - name: The image serves mounted routes as nobody on a read-only filesystem
        run: |
          docker run -d --name portal --read-only --user 65534:65534 -p 8080:8080 \
            -v "$PWD/src/data/routes.example.json:/config/routes.json:ro" openlakeforge-portal:ci
          for _ in $(seq 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/ | grep -q 'href="http://trino.olf.localhost"'
          docker logs portal
