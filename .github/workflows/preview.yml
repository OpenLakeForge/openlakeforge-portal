name: Preview

# Publishes a throwaway image of a branch so it can be deployed on OpenLakeForge
# without cutting a release: pr-<number> for a pull request from this repository,
# branch-<name> for a manual run. Never a semver or latest tag, never a release.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/openlakeforge/openlakeforge-portal

jobs:
  preview:
    # Fork pull requests get a read-only token and cannot push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Name the tag and the version
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base="$(jq -r .version package.json)"
          if [ "$EVENT" = pull_request ]; then
            tag="pr-$PR"
            version="$base-pr$PR"
          else
            # A branch name may hold characters a tag cannot (a slash); keep a valid, bounded tag.
            name="$(printf '%s' "$REF_NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9._\n-' '-' | sed 's/^[-.]*//' | cut -c1-100)"
            tag="branch-${name:-x}"
            version="$base-$(git rev-parse --short=7 HEAD)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ env.TAG }}
      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Preview image: \`${IMAGE}:${TAG}@${DIGEST}\`"
            echo
            echo "Deploy it with OpenLakeForge's local deploy, in a var file passed to \`--var-file\`:"
            echo
            echo '```hcl'
            echo "portal_image = \"${IMAGE}:${TAG}@${DIGEST}\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
